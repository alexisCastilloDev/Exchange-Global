<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>SIPAP (simulado) · Ingresar al panel</title>
    <style>
        body { font-family: sans-serif; max-width: 360px; margin: 80px auto; color: #222; }
        h1 { font-size: 1.1rem; }
        label { display: block; font-weight: bold; margin-top: 14px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 4px;
        }
        .errorlist { color: #b00020; list-style: none; padding: 0; margin: 12px 0 0; }
        button {
            margin-top: 20px; padding: 10px 16px; border: none; border-radius: 4px;
            cursor: pointer; font-size: 1rem; background: #2e7d32; color: white; width: 100%;
        }
    </style>
</head>
<body>
    <h1>Panel administrativo de SIPAP (simulado)</h1>
    <p>Acceso restringido a operadores autorizados.</p>

    {% if form.errors %}
        <ul class="errorlist">
            <li>Usuario o contraseña incorrectos.</li>
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="{{ form.username.id_for_label }}">Usuario</label>
        {{ form.username }}
        <label for="{{ form.password.id_for_label }}">Contraseña</label>
        {{ form.password }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Ingresar</button>
    </form>
</body>
</html>
