{% extends 'home.html' %}

{% block content %}
<div style="max-width: 720px; margin: 20px auto; font-family: sans-serif;">
  <h2>Editar Usuario: {{ usuario.email }}</h2>

  {% if messages %}
    {% for message in messages %}
      <div style="padding: 10px; margin-bottom: 8px; border-radius: 4px; background: #f8f9fa;">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div style="margin-bottom: 10px;">
      <label>Nombre</label><br>
      <input type="text" name="first_name" value="{{ usuario.first_name }}" style="padding: 8px; width: 100%;">
    </div>

    <div style="margin-bottom: 10px;">
      <label>Apellido</label><br>
      <input type="text" name="last_name" value="{{ usuario.last_name }}" style="padding: 8px; width: 100%;">
    </div>

    <div style="margin-bottom: 10px;">
      <label><input type="checkbox" name="is_active" value="on" {% if usuario.is_active %}checked{% endif %}> Usuario Activo</label>
    </div>

    <button type="submit" style="padding: 10px 14px; background:#28a745; color:white; border:none; border-radius:4px;">Guardar Cambios</button>
    <a href="{% url 'lista_usuarios' %}" style="margin-left:10px; text-decoration:none;">Cancelar</a>
  </form>
</div>
{% endblock %}
