{% extends 'base.html' %}

{% block title %}Editar usuario - Global Exchange{% endblock %}

{% block content %}
<div class="ge-page-header">
    <div>
        <h1>Editar usuario</h1>
        <p>{{ usuario.email }}</p>
    </div>
</div>

<div class="ge-card" style="max-width: 560px;">
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="first_name" value="{{ usuario.first_name }}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Apellido</label>
            <input type="text" name="last_name" value="{{ usuario.last_name }}" class="form-control">
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a href="{% url 'lista_usuarios' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
