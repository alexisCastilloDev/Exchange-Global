{% if cliente_activo %}
<li class="nav-item dropdown">
    <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown">
        🏢 Operando como: <strong>{{ cliente_activo.nombre|default:cliente_activo.razon_social }}</strong>
    </a>
    <ul class="dropdown-menu">
        <li><h6 class="dropdown-header">Cambiar de Cliente</h6></li>
        {% for c in mis_clientes %}
            <li>
                <a class="dropdown-item {% if c.pk == cliente_activo.pk %}active{% endif %}" 
                   href="{% url 'cambiar_cliente' c.pk %}">
                    {{ c.nombre|default:c.razon_social }}
                </a>
            </li>
        {% endfor %}
    </ul>
</li>
{% endif %}
