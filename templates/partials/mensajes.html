<!--
Parcial reutilizable para mostrar mensajes de Django.
Herencia: se incluye con include y no define bloques.
Contexto esperado: messages; cada elemento se expone como message.
-->
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    {% endfor %}
{% endif %}
