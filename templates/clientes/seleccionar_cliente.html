{% extends 'home.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Seleccione el cliente en cuyo nombre va a operar</h2>
    <p>Su cuenta tiene acceso a múltiples perfiles de clientes.</p>

    <form method="post">
        {% csrf_token %}
        <div class="list-group mb-4">
            {% for cliente in clientes %}
            <label class="list-group-item d-flex gap-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="cliente_id" value="{{ cliente.pk }}" required>
                <span>
                    <strong>{{ cliente }}</strong>
                    <small class="d-block text-muted">ID: {{ cliente.identificador }} | Segmento: {{ cliente.segmento }}</small>
                </span>
            </label>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">Continuar</button>
    </form>
</div>
{% endblock %}
