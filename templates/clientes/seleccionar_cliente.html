<!--
Selector del cliente activo para usuarios con varias asociaciones.
Hereda de: base.html.
Bloques definidos: title, content.
Contexto esperado: clientes.
-->
{% extends 'base.html' %}

{% block title %}Seleccionar cliente - Global Exchange{% endblock %}

{% block content %}
<div class="ge-page-header">
    <div>
        <h1>¿En nombre de qué cliente vas a operar?</h1>
        <p>Tu cuenta tiene acceso a múltiples perfiles de clientes.</p>
    </div>
</div>

<div class="ge-card" style="max-width: 560px;">
    <form method="post">
        {% csrf_token %}
        <div class="list-group mb-4">
            {% for cliente in clientes %}
            <label class="list-group-item d-flex gap-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="cliente_id" value="{{ cliente.pk }}" required>
                <span>
                    <strong>
                        {% if cliente.tipo_cliente == 'JURIDICA' %}
                            {{ cliente.razon_social }}
                        {% else %}
                            {{ cliente.nombre }} {{ cliente.apellido }}
                        {% endif %}
                    </strong>
                    <small class="d-block text-muted">
                        {% if cliente.tipo_cliente == 'JURIDICA' %}Persona jurídica{% else %}Persona física{% endif %} &middot;
                        CI/RUC: {{ cliente.identificador|default:"N/A" }} &middot;
                        Segmento: {{ cliente.get_segmento_display }} &middot;
                        {% if cliente.is_active %}Activo{% else %}Inactivo{% endif %}
                    </small>
                </span>
            </label>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">Continuar</button>
    </form>
</div>
{% endblock %}
