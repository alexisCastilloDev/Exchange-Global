<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar Cliente - Global Exchange</title>
    <style>body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; } .opcion { display:block; padding:12px; border:1px solid #ddd; border-radius:6px; margin-bottom:10px; cursor:pointer; } .opcion:hover { background:#f8f9fa; } .btn-primary { padding:10px 18px; background:#007bff; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:15px; }</style>
</head>
<body>
    <h1>¿En nombre de qué cliente vas a operar?</h1>

    {% if clientes %}
        <form method="POST">
            {% csrf_token %}
            {% for cliente in clientes %}
                <label class="opcion">
                    <input type="radio" name="cliente_id" value="{{ cliente.pk }}" required>
                    {{ cliente }}
                </label>
            {% endfor %}
            <button type="submit" class="btn-primary">Continuar</button>
        </form>
    {% else %}
        <p>No tenés ningún cliente asociado a tu usuario. Contactá a un administrador.</p>
    {% endif %}
</body>
</html>
