<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Cliente - Global Exchange</title>
    <style>.errorlist { color: red; font-weight: bold; list-style-type: none; padding-left: 0; }</style>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>Registrar / Editar Cliente</h1>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Guardar Cliente
        </button>
    </form>

    <br>
    <p><a href="{% url 'panel_admin' %}" style="text-decoration: none; color: #007bff;">Volver al panel</a></p>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const selectTipo = document.getElementById("id_tipo_cliente");
            const pNombre = document.getElementById("id_nombre")?.closest("p");
            const pApellido = document.getElementById("id_apellido")?.closest("p");
            const pRazonSocial = document.getElementById("id_razon_social")?.closest("p");

            if (selectTipo) {
                function alternarCampos() {
                    if (selectTipo.value === "JURIDICA") {
                        if (pNombre) pNombre.style.display = "none";
                        if (pApellido) pApellido.style.display = "none";
                        if (pRazonSocial) pRazonSocial.style.display = "block";
                    } else {
                        if (pNombre) pNombre.style.display = "block";
                        if (pApellido) pApellido.style.display = "block";
                        if (pRazonSocial) pRazonSocial.style.display = "none";
                    }
                }
                selectTipo.addEventListener("change", alternarCampos);
                alternarCampos();
            }
        });
    </script>
</body>
</html>
