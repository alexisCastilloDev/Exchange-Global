# Entorno de "producción" académica de Global Exchange: una sola instancia
# EC2 con Docker Compose (sin ECS/Fargate, para respetar el presupuesto
# casi $0). La base de datos PostgreSQL vive aparte, en RDS free tier,
# por eso no hay un servicio "db" acá.
#
# Uso (desde deploy/aws/, con el .env de producción ya armado):
#   docker compose --env-file ../../.env up -d --build
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - staticfiles:/app/staticfiles
    expose:
      - "8000"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # start-dev: suficiente para una entrega académica (no requiere
    # pre-construir el tema ni cachear el realm). Para un Keycloak
    # realmente productivo habría que migrar a `start` con un build
    # optimizado aparte.
    command: start-dev --http-relative-path /auth
    environment:
      KC_HOSTNAME: "https://${DOMINIO}/auth"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL_HOST: ${DB_HOST}
      KC_DB_URL_PORT: ${DB_PORT}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    # Tema de login propio (keycloak/themes/global-exchange). Para activarlo
    # en el realm, una sola vez después del primer `up`:
    #   docker compose exec keycloak /opt/keycloak/bin/kcadm.sh config credentials \
    #     --server http://localhost:8080/auth --realm master \
    #     --user "$KEYCLOAK_ADMIN_USER" --password "$KEYCLOAK_ADMIN_PASSWORD"
    #   docker compose exec keycloak /opt/keycloak/bin/kcadm.sh update realms/global-exchange \
    #     -s loginTheme=global-exchange -s emailTheme=global-exchange -s registrationAllowed=true \
    #     -s resetPasswordAllowed=true -s rememberMe=true \
    #     -s internationalizationEnabled=true -s 'supportedLocales=["es"]' -s defaultLocale=es
    volumes:
      - ../../keycloak/themes/global-exchange:/opt/keycloak/themes/global-exchange:ro
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
      - keycloak

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Sin "command": este servicio no se levanta con `docker compose up`,
    # se invoca puntualmente con `docker compose run certbot ...`
    # (ver guía: emisión y renovación del certificado).
    entrypoint: "true"

volumes:
  staticfiles:
  certbot-etc:
  certbot-www:
