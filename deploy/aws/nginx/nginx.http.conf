# Fase 1 (sin certificado todavía): solo sirve el reto ACME de Let's
# Encrypt y redirige el resto a HTTPS. Se usa para la primera emisión
# del certificado; después se reemplaza por nginx.conf (fase 2, con TLS).
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
