# Fase 2 (con certificado ya emitido por certbot). Termina TLS acá y
# reenvía a la app (Gunicorn) y a Keycloak dentro de la red de Docker.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name global-exchange-11.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/global-exchange-11.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/global-exchange-11.duckdns.org/privkey.pem;

    client_max_body_size 10M;

    # Keycloak envía encabezados y cookies grandes; con los buffers por
    # defecto Nginx responde 502 "upstream sent too big header".
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # El "/" final en proxy_pass le quita el prefijo "/sipap/" antes de
    # reenviar; sipap-sim no sabe que corre bajo ese prefijo (su
    # SIPAP_SCRIPT_NAME se lo vuelve a agregar solo al generar URLs, ver
    # sipap_sim/sipap_sim/settings.py).
    location /sipap/ {
        proxy_pass http://sipap-sim:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}