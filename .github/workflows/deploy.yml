# Despliegue automático a producción (EC2) cada vez que llegan cambios a main
# (en Git Flow: después de cada `git flow release finish` + push).
#
# No usa SSH: GitHub obtiene credenciales temporales de AWS por OIDC y le
# ordena a la EC2, vía AWS Systems Manager (SSM), que haga git pull y
# reconstruya los contenedores con deploy/aws/deploy.sh.
# Ningún secreto vive en GitHub; los valores de abajo no son confidenciales.

name: Deploy a producción

on:
  push:
    branches: [main]
  workflow_dispatch: # permite relanzarlo a mano desde la pestaña Actions

permissions:
  id-token: write # necesario para pedir credenciales temporales a AWS (OIDC)
  contents: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: false # nunca cortar un despliegue a la mitad

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::266563806357:role/github-actions-deploy
  EC2_INSTANCE_ID: i-0170184fa25ac1665

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener credenciales temporales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar que la EC2 esté encendida
        run: |
          ESTADO=$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Estado de la EC2: $ESTADO"
          if [ "$ESTADO" != "running" ]; then
            echo "::error::La EC2 está '$ESTADO'. Enciende el RDS y la EC2, y luego relanza este workflow desde la pestaña Actions (Run workflow)."
            exit 1
          fi

      - name: Enviar el despliegue a la EC2 por SSM
        id: enviar
        run: |
          cat > params.json <<'EOF'
          {"commands":["sudo -u ubuntu -H bash -c 'set -euo pipefail; cd /home/ubuntu/global_exchange; git fetch origin; git checkout main; git pull --ff-only origin main; bash deploy/aws/deploy.sh'"]}
          EOF
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "Comando SSM: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Esperar el resultado y mostrar la salida del servidor
        env:
          COMMAND_ID: ${{ steps.enviar.outputs.command_id }}
        run: |
          STATUS=Pending
          for i in $(seq 1 150); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "=============== Estado final: $STATUS ==============="
          echo "----- stdout del servidor -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr del servidor (Docker escribe ahí su progreso; no todo es error) -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" --query StandardErrorContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::El despliegue terminó con estado $STATUS. Revisa la salida de arriba."
            exit 1
          fi
