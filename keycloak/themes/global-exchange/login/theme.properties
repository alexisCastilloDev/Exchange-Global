# Tema de login "Global Exchange" para Keycloak 26.
# Hereda del tema "keycloak" (y este de "base") para conservar los
# scripts, mensajes y páginas que no se personalizan (OTP, errores,
# términos, etc.). El layout (template.ftl) es propio y no carga
# PatternFly: todas las clases kc* de abajo apuntan a clases ge-* del
# CSS del tema, así las páginas heredadas también quedan con el
# sistema de diseño del back-office (static/css/style.css).

parent=keycloak
import=common/keycloak

styles=css/global-exchange.css
stylesCommon=

locales=es,en

meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=ge-kc
kcBodyClass=ge-kc__body
kcLoginClass=
kcHeaderClass=
kcHeaderWrapperClass=
kcFormCardClass=
kcFormHeaderClass=
kcContentWrapperClass=ge-kc-row
kcInfoAreaWrapperClass=

## Locale
kcLocaleMainClass=ge-locale
kcLocaleWrapperClass=
kcLocaleDropDownClass=
kcLocaleListClass=ge-locale__menu
kcLocaleListItemClass=
kcLocaleItemClass=ge-locale__item

## Alertas
kcAlertClass=ge-alert
kcAlertTitleClass=ge-alert__text
kcFeedbackErrorIcon=bi bi-exclamation-circle-fill
kcFeedbackWarningIcon=bi bi-exclamation-triangle-fill
kcFeedbackSuccessIcon=bi bi-check-circle-fill
kcFeedbackInfoIcon=bi bi-info-circle-fill

## Formularios
kcFormClass=ge-form
kcFormGroupClass=ge-field
