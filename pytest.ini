[pytest]
DJANGO_SETTINGS_MODULE = global_exchange.settings.dev
python_files = tests.py test_*.py *_tests.py
# sipap_sim/ es un proyecto Django independiente (su propio manage.py,
# settings y pytest.ini): sin esto, pytest lo recorrería igual al correr
# desde la raíz y probaría sus tests contra el settings de Global
# Exchange, no el suyo.
testpaths = tests